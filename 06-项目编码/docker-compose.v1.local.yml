services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - pet_xiaoman_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    image: pet_xiaoman-v1-api:local
    build:
      context: ./pet_xiaoman_api
      dockerfile: Dockerfile
    env_file:
      - ./pet_xiaoman_api/.env.v1.local
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - pet_xiaoman_uploads:/app/uploads
    ports:
      - "18010:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  admin:
    image: pet_xiaoman-v1-admin:local
    build:
      context: ./pet_xiaoman_admin
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "15173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pet_xiaoman_mysql:
  pet_xiaoman_uploads:
