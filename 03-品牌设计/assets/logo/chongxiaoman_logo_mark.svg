<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- chongxiaoman_logo_mark · 将满的圆 · 精稿 v1.0
       精稿记录（checklist 对照）：
       ① 锚点偏移：主弧微椭圆 rx72.6/ry71.1（非正圆），rotate -7.4°（非整数）；
         三趾中心坐标全部小数化，趾间旋转角 -14.2°/+8.7° 非对称
       ② 线宽节奏：主弧 8.8px + 局部加重弧 10.6px 两段叠加（非等宽）
       ③ 缺口 137.4°（非 137 整数），dashoffset 使缺口位于上方偏右
       ④ 爪印占圆内径 ~25%，偏心放置（几何中心右上 6.2px）
